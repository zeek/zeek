# Zeek Network Security Monitor
#
# This configuration file is used by the zeek-systemd-generator executable
# to generate systemd unit files for the different Zeek components at systemd
# daemon-reload time. See the accompanying README for more details.
# The configuration itself isn't systemd specific and conceptionally it can
# be used to produce scripts or artifacts for other supervisors (supervisord,
# runit, ...), too.
[zeek]
# Whether to run the manager process. For a single-host
# Zeek setup, always set this to 1 (default 0).
manager = 1
# The number of logger processes to run. If no loggers
# are configured, the manager process acts as logger (default 0).
loggers = 1

# The number of proxy processes to run (default 0).
proxies = 1

### Process Control and Confinement

# User and group to run Zeek under, (default is zeek).
# user = zeek
# group = zeek

# Default restart interval a Zeek process unexpectedly terminates.
# restart_interval_sec = 1

# The maximum amount of memory an individual process type may
# consume. The default unit is bytes, you may add K, M, G, T
# suffixes as supported by systemd. With zeek-systemd-generator,
# this is enforced using cgroups.
#
# <node_type>_memory_max = 1234M
# manager_memory_max =
# logger_memory_max =
# proxy_memory_max =

# The nice levels to configure for individual processes types.
# manager_nice = 0
# logger_nice = 0
# proxy_nice = 0

# The CPUs where non-worker processes are confined to. Note that this isn't
# process pinning, it instead lists the CPUs that each individual process is
# allowed to run on. Manager and logger processes are heavily multi-threaded
# as of Zeek 9.0, so process-level CPU pinning isn't all that useful for them.
#
# manager_cpu_set = 4,5,6,7
# logger_cpu_set = 4,5,6,7
# proxy_cpu_set = 8,9,10,11

### Process Arguments

# Keep this list short. More extensive configuration should be done
# via local.zeek or the Configuration framework. Worker processes have
# the ``-i <interface>`` prepended. Default is to load local.zeek
# args = local

# Process type specific args. Similarly to args, don't overuse this. These
# all default to empty values.
# manager_args =
# logger_args =
# proxy_args =

### Process Environment

# Use continuation lines for environment variables like so:
# env =
#   LD_PRELOAD=/usr/local/lib/libjemalloc.so
#   MALLOC_CONF=prof:true,prof_prefix:jeprof.out,prof_final:true,lg_prof_interval:28
#
# The env option applies to all processes.
#
# Process type specific environment variables:
# manager_env =
# logger_env =
# proxy_env =

### Paths

# Prepend the following paths to ZEEKPATH. You might want to use this
# with scripts in unusual locations and you want to let Zeek know about
# these. If you solely use zkg, you should not need to set anything here.
# ext_zeek_path = /path/to/extra1:/path/to/extra2

# The PATH to set for Zeek. The default is always as shown below with
# the base_dir / bin directory prepended.
# path = /usr/local/bin:/usr/bin:/bin

# Prepend the following paths to PATH. See also path.
# ext_path = /opt/napatech/bin

# Override Zeek's base directory.
# base_dir =

### Cluster

# Arguments place on Zeek's command-line specific for the cluster backend
# configuration. The default is to enable the ZeroMQ cluster backend.
#
# cluster_backend_args = frameworks/cluster/backend/zeromq
#
# The base port for Zeek's listener ports in a Zeek cluster.
# port = 27760
#
# The base port for the Prometheus HTTP listener for each process. Setting
# this port to 0 disabled metrics.
# metrics_port = 9991
#
# Default listening addresses to use for cluster functionality. Also
# the default address for the metrics server.
# address = 127.0.0.1
#
# To listen on IPv6, put brackets around the address.
# address = [::1]

### Archiver

# Zeek logger processes (or manager process) usually rotate their completed log
# files into <PREFIX>/var/spool/zeek/log-queue. The zeek-archiver process picks
# up these logs and archives them into <PREFIX>/var/logs/zeek/<date>.
# If your Zeek configuration is such that logs are directly sent to Kafka
# or another queueing system, set this to 0.
# You can also set archiver to the path to a customer archiver executable
# that is expected to run continuously.
# archiver = 1

# Extra arguments passed to the zeek-archiver invocation.
# archiver_args = -v -i 5

# The maximum memory the archiver process is allowed to use.
# archiver_memory_max

# The nice level to use for the archiver process.
# archiver_nice = 0

### Interfaces and Workers

# After the [zeek] section, place one or more [interface ...] sections
# that describe the network interfaces this Zeek installation monitors.
#
# [interface wifi]
# Use Linux's AF_PACKET (built-in) relying on the kernel's
# default packet dissector for load balancing.
# interface = af_packet::wlp0s20f3
# workers = 4
#
# The interface option supports the following substitution variables
# for templating purposes:
#
#   worker_index:           1, 2, 3, ...
#   worker_index0:          0, 1, 2, ...
#   host_worker_index:      1, 2, 3, ... (does not reset per interface)
#   host_worker_index0:     0, 1, 2, ... (does not reset per interface)
#   worker_cpu:             CPU from workers_cpu_list or empty if not set.
#   interface_section_name: The name in the section header
#
# The list of CPUs on which to pin workers (modulo semantics).
# # Pinning is disabled when this list is empty.
# workers_cpu_list =
#
# # Workers are sequentially pinned to the expanded CPU list. For below example,
# # worker-1 is pinned to CPU 0, worker-2 to CPU 1, and so on.
# workers_cpu_list = 0,1,2,3
#
# # Ranges and strides are allowed (yields CPUs 0, 2, 4, 6, 8, 10, 13, 16, 19)
# workers_cpu_list = 0-8:2,10-20:3

# Per-worker memory limit. Needs to be set per interface section.
# The default unit is bytes, you may add K, M, G, T
# suffixes as supported by systemd. On Linux, this is enforced
# using cgroups.
# worker_memory_max =

# The NUMA policy to set for all workers.
# Allowed values are currently default and local.
# workers_numa_policy = local

# Some interface section examples:

# # Use two workers with libpcap to listen on the loopback interface.
# [interface loopback]
# interface = lo
# workers = 2
#
# # Use Napatech streams and pin workers to CPUs 4 through 67 (requires the Napatech plugin)
# [interface napatech]
# interface = napatech::${worker_index0}
# workers = 64
# workers_cpu_list = 4-67
#
# # Using NETMAP pipes for 8 workers using the netmap plugin.
# [interface eth0]
# interface = netmap::eth0}${worker_index0}
# workers = 8
#
# # Using the UDP packet source.
# [interface geneve]
# interface = udp::0.0.0.0:6081:geneve
# workers = 4
#
# [interface geneve-ipv6]
# interface = udp::[::]:6081:geneve
# workers = 4
#
# # Using individual interface per worker: veth0, veth1, veth2, veth3
# [interface per-worker-veth]
# interface = af_packet::veth${worker_index0}
# workers = 4


### Section-less Format

# If you made it here: There's also a section-less format:
#
# If you only ever have a single interface to monitor (maybe container or
# appliance), you may remove the superfluous section headers [zeek] and
# [interface ...] and only keep the plain option names. This removes the
# section name from the worker's cluster node names (and service names
# and working directories) to be more minimal.
#
# Concretely, the following is the most minimal zeek.conf for monitoring
# eth0 with two workers using AF_PACKET:
#
#     interface = af_packet::eth0
#     workers = 2
#     manager = 1
#     loggers = 1
#     proxies = 1
